# Publishes a read-only copy of the deck to GitHub Pages on every push to the tldraw-v3 branch
# (the publishing branch; main stays on the newer tldraw for editing).
#
# One-time setup (repo Settings): Pages > Build and deployment > Source: "GitHub Actions", and
# Settings > Environments > github-pages > Deployment branches: allow tldraw-v3.
# No license key is needed: this branch uses tldraw 3.x, which runs in production without one (and
# shows the "made with tldraw" watermark).
name: Publish deck

on:
  push:
    branches: [tldraw-v3]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The deck that gets published. Change this to publish a different file.
  DECK: decks/sor-nov-26.tldr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare deck (convert to the 3.x file format, remove speaker notes)
        run: |
          node scripts/downgrade-deck.mjs "$DECK" public/deck.tldr
          node scripts/strip-notes.mjs public/deck.tldr
      - name: Build read-only viewer
        run: npm run build
        env:
          VITE_VIEWER: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
